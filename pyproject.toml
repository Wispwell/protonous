[project]
name = "protonous"
dynamic = ["version"]
description = "A lightweight agent framework over OpenRouter: typed context, one provider layer, one loop."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=2.4",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
protonous = "protonous.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/protonous/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/protonous"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
asyncio_mode = "auto"
markers = [
    "model: performs a real model/API call (needs OPENROUTER_API_KEY); deselected by default",
]
